name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*' # Si attiva solo con tag che iniziano per "v" (es. v2.1)

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # Permesso obbligatorio per creare la Release

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Installazione Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Compilazione con PyInstaller
      run: python build_exe.py

    - name: Pubblicazione GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        generate_release_notes: true